<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Move Agent · 真机控制台</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/robot.css"></head>
<body><main class="shell"><header><div><span class="kicker">LIVE ROBOT CONTROL</span><h1>Move Agent <em>Robot</em></h1></div><div class="online"><i></i><span id="connection">连接中</span></div></header><section class="layout"><div class="stage-card robot-stage"><div class="card-head"><span>LUNA / REMOTE API</span><span id="baseUrl"></span></div><div class="robot-visual"><div class="rings"></div><div class="robot-icon">L</div><strong id="readyTitle">正在读取机器人状态</strong><p id="readyDetail">健康检查不会触发机器人动作</p></div><div class="health-grid"><div><small>运动准入</small><b id="ready">—</b></div><div><small>任务锁</small><b id="busy">—</b></div><div><small>ROS 反馈</small><b id="ros">—</b></div><div><small>底盘连接</small><b id="connected">—</b></div></div></div><aside><section class="panel command"><label for="prompt">真实机器人任务</label><textarea id="prompt" rows="4" placeholder="例如：移动到预设位姿 3"></textarea><div class="warning">提交后可能触发真实底盘、机械臂或夹爪运动。确保运动范围内无人。</div><button id="run" class="run">提交给智能体 <span>→</span></button><button id="cancel" class="danger">紧急取消当前动作</button><p id="agentText">等待任务</p></section><section class="panel metrics"><div><strong id="leftTemp">—</strong><small>左夹爪 °C</small></div><div><strong id="rightTemp">—</strong><small>右夹爪 °C</small></div><div><strong id="phase">READY</strong><small>AGENT</small></div></section><section class="panel events"><div class="panel-title"><span>实时事件流</span><span class="badge">ROBOT</span></div><ol id="events"></ol></section></aside></section></main><script type="module" src="/robot.js"></script></body></html>
